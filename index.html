<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡纳克神庙·智能语音导览</title>
    <style>
        :root { --gold: #d4af37; --dark: #1a1510; --sand: #f4eae1; }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--dark); color: #fff;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        header {
            background-color: rgba(0,0,0,0.85); text-align: center; padding: 12px 0;
            border-bottom: 2px solid var(--gold); font-size: 1.1rem; font-weight: bold;
            color: var(--gold); letter-spacing: 2px; flex-shrink: 0;
        }
        #map-container {
            flex: 1; position: relative; background: #2a221b; overflow: hidden;
            display: flex; justify-content: center; align-items: center; min-height: 0;
            touch-action: none; /* 手势交给 JS 处理，避免与浏览器缩放/滚动冲突 */
        }
        #hand-drawn-map { width: 100%; height: auto; display: block; }
        .spot-marker {
            position: absolute; width: 15px; height: 15px;
            background-color: rgba(212,175,55,0.92); border: 1px solid #fff;
            color: var(--dark); border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-weight: bold;
            font-size: 8px; line-height: 1; cursor: pointer;
            box-shadow: 0 0 6px rgba(212,175,55,.85);
            transform: translate(-50%,-50%); transition: transform .2s, background-color .2s;
            z-index: 10; -webkit-tap-highlight-color: transparent;
        }
        /* 透明加大热区：视觉 15px，手指可点范围约 30px */
        .spot-marker::after {
            content: ""; position: absolute; left: 50%; top: 50%;
            width: 30px; height: 30px; transform: translate(-50%,-50%);
            border-radius: 50%;
        }
        .spot-marker.active {
            background-color: #ff4500; border-color: #fff;
            box-shadow: 0 0 12px #ff4500; z-index: 20;
            transform: translate(-50%,-50%) scale(1.6);
        }
        /* ===== 缩放/拖动：复位按钮 ===== */
        #zoom-reset {
            position: absolute; top: 10px; right: 10px; z-index: 30;
            width: 34px; height: 34px; border-radius: 50%;
            border: 1px solid var(--gold); background: rgba(0,0,0,.65);
            color: var(--gold); font-size: 16px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            -webkit-tap-highlight-color: transparent;
        }
        /* ===== 语音播放条 ===== */
        .audio-bar {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.05); padding: 10px 12px;
            border-radius: 8px; border-left: 4px solid var(--gold);
        }
        .audio-meta { flex: 1; min-width: 0; }
        #spot-title { display: block; font-size: .92rem; color: var(--sand);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #spot-sub { display: block; font-size: .72rem; color: #9a8a6a; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play-btn {
            background-color: var(--gold); border: none; color: var(--dark);
            padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
            flex-shrink: 0;
        }
        .play-btn:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        .speed-btn {
            background: rgba(212,175,55,0.15); border: 1px solid var(--gold);
            color: var(--gold); padding: 6px 10px; border-radius: 20px;
            font-weight: bold; cursor: pointer; flex-shrink: 0; font-size: .85rem;
        }
        .audio-time { font-size: .75rem; color: #9a8a6a; flex-shrink: 0; }
        .audio-track { flex: 2; min-width: 60px; height: 4px; background: rgba(255,255,255,.15);
            border-radius: 2px; cursor: pointer; position: relative; }
        .audio-track .played { position: absolute; left: 0; top: 0; bottom: 0;
            background: var(--gold); border-radius: 2px; width: 0; }
        /* ===== 提示文字 ===== */
        .empty-tip { color: #7a6c52; font-size: .82rem; text-align: center; padding: 18px 0; }
        /* ===== 问答区 ===== */
        .chat-section { display: flex; flex-direction: column; gap: 8px; }
        .chat-box {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,.3);
            border-radius: 8px; padding: 12px; min-height: 60px; max-height: 130px;
            overflow-y: auto; font-size: .88rem; line-height: 1.5; color: #ddd;
        }
        .chat-input-wrap { display: flex; gap: 8px; }
        .chat-input-wrap input {
            flex: 1; background: #2b231a; border: 1px solid var(--gold);
            border-radius: 20px; padding: 8px 15px; color: #fff; outline: none; font-size: .9rem;
        }
        .chat-input-wrap button {
            background: var(--gold); border: none; color: var(--dark);
            border-radius: 20px; padding: 8px 20px; font-weight: bold; cursor: pointer;
        }
        /* ===== 照片灯箱（上方）+ 播放条（下方）+ 文字讲解 ===== */
        #spot-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999;
            display: flex; flex-direction: column; justify-content: flex-end;
            opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease;
        }
        #spot-modal.show { opacity: 1; visibility: visible; }
        .modal-body {
            max-height: 92vh; display: flex; flex-direction: column;
            padding: 12px 12px 16px; gap: 10px; overflow: hidden;
            transform: translateY(20px); transition: transform .25s ease;
        }
        #spot-modal.show .modal-body { transform: translateY(0); }
        .photo-frame {
            flex: 1; min-height: 0; display: flex; justify-content: center;
            align-items: center; position: relative;
        }
        .photo-frame img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            border: 2px solid var(--gold); border-radius: 10px;
            box-shadow: 0 0 40px rgba(212,175,55,.45); background: #000;
        }
        /* 无图时的预留占位 */
        .photo-placeholder {
            width: 100%; height: 100%; border: 2px dashed rgba(212,175,55,.45);
            border-radius: 10px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 8px; color: #7a6c52;
            background: rgba(212,175,55,0.04);
        }
        .photo-placeholder .ph-icon { font-size: 2.2rem; }
        #modal-close {
            position: absolute; top: 14px; right: 14px; width: 36px; height: 36px;
            border-radius: 50%; border: 1px solid var(--gold); background: rgba(0,0,0,.7);
            color: var(--gold); font-size: 20px; cursor: pointer; z-index: 10;
            display: flex; justify-content: center; align-items: center;
        }
        #modal-title { color: var(--gold); font-size: 1rem; font-weight: bold;
            text-align: center; letter-spacing: 1px; flex-shrink: 0; }
        #modal-sub { color: #9a8a6a; font-size: .74rem; text-align: center; flex-shrink: 0;
            margin-top: -6px; }
        /* 弹层内的文字讲解（可展开） */
        .modal-transcript {
            flex: 0 1 auto; min-height: 0; max-height: 26vh; overflow-y: auto;
            background: rgba(26,21,16,.95); border: 1px solid rgba(212,175,55,.3);
            border-radius: 8px; padding: 10px 12px; font-size: .85rem;
            line-height: 1.65; color: #ddd;
        }
        .modal-audio {
            flex-shrink: 0; display: flex; align-items: center; gap: 10px;
            background: rgba(26,21,16,.97); border-top: 1px solid rgba(212,175,55,.35);
            padding: 10px 12px; border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>🏛️ 卡纳克神庙·智能语音微导览</header>

        <div class="audio-bar">

                <span id="spot-title">🔊 请点击地图上的金色圆点开启讲解</span>

            <div class="chat-box" id="ai-bubble">
                🔮 <b>法老密示：</b><br>游客，点击地图上的金色圆点即可聆听三千年的石头说话。若有历史疑问，尽管在此向我发问……
            </div>
            <div class="chat-input-wrap">
                <input type="text" id="user-question" placeholder="向埃及考古讲解员提问..." onkeypress="handleKeyPress(event)">

    <!-- ============ 点位详情弹层：图片(或预留位) + 播放条 + 文字讲解 ============ -->
    <div id="spot-modal" onclick="closeModal(event)">
        <button id="modal-close" onclick="closeModal(null,true)">&times;</button>
        <div class="modal-body" onclick="event.stopPropagation()">
            <div>
                <div id="modal-title"></div>
                <div id="modal-sub"></div>
            </div>
            <div class="photo-frame" id="photo-frame"></div>
            <div class="modal-audio">
                <button class="play-btn" id="modal-play" onclick="toggleAudio()">播放</button>
                <div class="audio-track" id="modal-track" onclick="seekAudio(event)"><div class="played" id="modal-played"></div></div>
                <span class="audio-time" id="modal-time">--:-- / --:--</span>
                <button class="speed-btn" id="speed-btn" onclick="cycleSpeed()">1.0x</button>
            </div>
            <div class="modal-transcript" id="modal-transcript"></div>
        </div>
    </div>

    <script>
        /* ===== 28 个点位数据（按参观动线编号）：编号 / 中文名 / 英文名（搜图用）/ 文字版讲解 ===== */
        const SPOTS = {
        1: { cn: "神庙港 · 开场总览", en: "Karnak Temple Main Entrance & Visitor Route", text: "各位，欢迎来到卡纳克。先别急着往里走——你现在站的位置，四千年前是尼罗河边的码头。\n先认识一下今天的主角：阿蒙。他原本只是底比斯的一个地方神，后来被一步步抬成了古埃及的国家主神，常与太阳神拉合称\"阿蒙-拉\"，是\"众神之王\"——接下来你听到的每一段，几乎都绕不开他。\n古埃及人到这儿不是坐车来的，是坐船。每年尼罗河涨水，阿蒙的神像被请上一条镀金的木船，叫\"神舫\"，由祭司抬着从水路靠岸，再一路抬进神庙。远处来的朝圣者也在这里下船，他们可能走了一个月，就为了在门口看一眼神的队伍。你今天脚下这段路的长度，差不多就是他们\"从人的世界走到神的世界\"的距离。\n在开始之前，给你一个心理准备：卡纳克不是一座庙，它是一座\"神的城市\"。古埃及人自己叫它 **Ipet-isut**，\"最被精选的地方\"——他们相信这里是神在人间的家。它占地一百多公顷，前后修了近两千年，三十多位法老轮流添砖加瓦。\n这个家里住着一家三口：阿蒙、他的妻子穆特、他们的儿子月神孔苏。鼎盛时期，八万多名祭司、工匠、面包师、酿酒师、织工、船夫、书吏为它服务。而且神庙是\"免税区\"——法老把土地和税收赐给神庙，神庙不向国家交税。赐得越多，神庙越富；神庙越富，祭司越强。到新王国末期，阿蒙神庙的势力已经大到能决定谁当法老。\n所以卡纳克不只是教堂。它是国库、粮仓、银行、法院，是一个以神的名义运转的实体。\n接下来两个多小时，我们从这里走到大柱厅、方尖碑、圣湖，再沿着斯芬克斯大道走向卢克索。请跟紧我，我们要穿越三千年。" },
        2: { cn: "公羊首斯芬克斯大道", en: "Avenue of Ram-headed Sphinxes, Karnak Temple", text: "现在两侧蹲着的这两排，是卡纳克最上镜的迎宾队——公羊首斯芬克斯。\n看它们的身体：狮子的身子，公羊的头。为什么是羊？因为公羊是阿蒙的化身之一，象征生命力与繁殖力；狮子代表王权。所以这一尊像，是把\"神\"和\"国王\"缝在了一起——羊头是神，狮身是王。\n再看前爪之间，通常夹着一尊小小的人像，那是拉美西斯二世，缩在神的脚下。这个构图不是谦卑，是政治：不是我小，是我被神捧着。站在神的掌心里，才叫合法。\n这条路有个专门的名字，叫 dromos，希腊语\"跑道\"。它不是通道，是仪式专用的走廊。原本两侧各一排，加起来几百尊，一直排到第一塔门。今天剩下这些，很多被沙子埋了，或者被搬进了博物馆。\n再注意一个变化：靠近卡纳克这一段是羊头，越往卢克索走，越变成人头狮身。因为羊头属于阿蒙，人头属于王权。从神的领地走向王的领地，形象也跟着换——这条路的尽头，就是法老的世界。\n最后说它的用途。每年奥佩特节，祭司抬着阿蒙、穆特、孔苏一家三口的神舫，从这里出发，一路向南走将近三公里，到卢克索神庙住下，再抬回来。普通人只能站在两边看。这条路不是布景，它就是节日本身。" },
        3: { cn: "第一塔门", en: "First Pylon of Karnak Temple, unfinished", text: "抬头看这道门。它是卡纳克最大的一道门，宽一百一十三米，高近三十米——但它是座烂尾门。\n塔门是古埃及神庙的标准门脸：两道向上收窄的巨墙，中间一个门洞，象征地平线，太阳每天从两座山之间升起。这道门由第三十王朝的奈克塔内博一世动工，那是埃及最后一个本土王朝，公元前四世纪。然后波斯人来了，工程停了，再也没继续。\n所以你现在能同时看到两个考古现场：门体内部是未完成的石块，前面那道斜坡是当年的泥砖运料坡道，工人就是踩着它把石头一块块推上去的。全世界最伟大的神庙群，正门是一道没修完的门——这件事本身就说明问题：卡纳克的每一代法老都想留名，但没人能把它做完。\n再看几个细节。墙是斜的，往里收，这叫\"收分\"，是古埃及建筑的通用手法，越往上越窄，视觉上更高更稳。门洞两侧的凹槽是插旗杆用的，旗杆是雪松木，从黎巴嫩进口，非常贵。能用得起进口雪松做旗杆的神庙，才叫大庙。门前广场上原本还立着巨像和一对如今只剩底座的方尖碑。\n按工程量估算，光这一道门就用了几万块砂岩，每块平均两吨，靠木橇、滚木和人力从尼罗河边拖过来。\n\"塔门\"这个词来自希腊语，意思是门楼。所以每座神庙的正门，都是一次日出。" },
        4: { cn: "塞提一世礼拜堂", en: "Chapels of Seti I, Karnak First Courtyard", text: "进第一塔门，左手边这三间并排的小礼拜堂，是塞提一世修的。\n别小看这三间小屋，它们是\"神的车库\"。\n古埃及的神像不住固定神龛，而是安在一艘艘可以抬动的小船上，叫\"神舫\"。每逢游行，祭司就抬着这些船出门。这三间小堂，从左到右分别供奉穆特、阿蒙和孔苏——底比斯神的一家三口。平时神的船就停在这里，等着下一次出门。\n塞提一世是第19王朝的开国法老，也是拉美西斯二世的父亲。他在这里做得特别用心，原因很实际：第19王朝是军人出身的新王朝，需要合法性。而合法性最便宜也最贵的写法，就是在卡纳克——最古老的神的地盘上——盖一间精致的房子。\n这里的浮雕质量是卡纳克最高的之一。塞提一世时期偏好凸雕，图案从石面凸出来，靠光影成形，成本高、难度大，也更怕后来的法老磨平。所以他的作品很多都没能留到今天——但这三间小堂留下来了。\n墙上的主题是老一套：国王向神献酒、献香、献食物，神把生命和统治权递还给他。这是一份合同，刻在石头上，签了两边。\n你注意看国王的手势和神的回应：神递过来的是\"生命之符\"，一个带环的十字。整个古埃及艺术的核心，就是这一个动作——我给你，你才有的。" },
        5: { cn: "露天博物馆", en: "Open Air Museum, Karnak – White Chapel of Senusret I & Red Chapel of Hatshepsut", text: "这个角落很多人会错过，因为它藏在第一庭院左侧的一道石门后面。但它是卡纳克的\"精华浓缩版\"。\n古埃及人有个习惯：新国王来修庙，会把前朝的旧建筑拆了当填料，砌进自己的墙里。考古学家后来把这些填料\"抽\"出来、原样复原，就成了这座露天博物馆。\n两件镇馆之宝。一件是辛努塞尔特一世的\"白堂\"，第12王朝，用白色雪花石膏建成。它的墙面浮雕是古埃及最精细的一批——因为雪花石膏软、好刻，能刻到毫米级。用的是极浅的凸雕，深度只有几毫米，靠光影显出轮廓，这在埃及雕刻里是难度最高的技术之一，石头一崩就废了。上面刻着上下埃及的象征植物被系在一起，还有各省的游行队伍。白堂底座刻着每省一人作代表，带着本地物产——纸莎草、莲花、鸟、鱼、金子。这是\"全国普查\"的图像版。\n另一件是哈特谢普苏特的\"红堂\"，用黑色花岗岩和红色石英岩拼成，对比极强。它只站了二十年就被拆了，石料被拿去填第三塔门。1996年，法国和埃及的团队用原石料把它重新拼了回去。\n一个白、一个红，两个都是\"神舫停靠站\"，供游行时停下来休息。石头上的浮雕保存得极完整，颜色都还在。\n这两座建筑的意义在于：它们代表了卡纳克\"最精致\"的一面，而不是\"最大\"的一面。卡纳克最精美的石头，藏在这个最不起眼的院子里。" },
        6: { cn: "塔哈尔卡亭", en: "Pavilion of Taharqa, Karnak – single giant column", text: "庭院中间那根孤零零站着的高柱，是卡纳克最\"孤独\"的建筑——塔哈尔卡亭。\n塔哈尔卡是第25王朝的努比亚法老。注意，是努比亚人统治埃及——今天苏丹北部一带。这在古埃及史上并不稀奇：帝国向南扩张到努比亚，几百年后，努比亚人反过来征服了埃及。而他们比埃及人更虔诚地崇拜阿蒙，因为阿蒙信仰早就传到了努比亚，他们的国王自称\"阿蒙之子\"。\n这座亭子原本有十根柱子，高二十一米，木顶，是一座开放式的\"神的候车厅\"——神舫在这里停靠、换装、接受献祭。后来它塌了，石头被拆去盖别的建筑，只剩这一根柱子和几块基石。今天它成了卡纳克最上镜的独柱，站在旁边仰头看，你才知道当年的人有多敢想。\n努比亚法老在卡纳克留下的东西不多，但每一件都很硬。因为对他们来说，在卡纳克盖房子不是加分项，是合法性本身——一个外来王朝，必须在最神圣的地方留下自己的名字。石头比血统更有说服力。\n柱头是\"开放的纸莎草\"，也就是开花形态，通常用在神的居所里。柱身上还能看到彩色的残迹——红、蓝、黄，那是原来帐篷式的装饰。\n塔哈尔卡还干过一件事：他把圣湖边那只圣甲虫从别处搬了过来。你现在在湖边看到它，得谢谢这位努比亚国王。" },
        7: { cn: "拉美西斯三世庙", en: "Temple of Ramesses III, Karnak First Courtyard", text: "庭院右侧这座小庙，是拉美西斯三世的\"庙中之庙\"。旅游团常常直奔大柱厅，把它漏了——其实它很有看头。\n先看门口两尊红色砂岩的立像，高约六米。红色砂岩在埃及叫石英岩，主要来自阿斯旺和赫勒万。往里走，是一排奥西里斯式的柱像——双手交叉抱在胸前、裹得像木乃伊的国王形象。为什么把活着的国王刻成死人？因为在古埃及的视觉语言里，法老和王权是\"不死\"的：他死了一次，还会再生。所以国王的形象总是和奥西里斯绑在一起。\n柱像手里握的是弯钩和连枷。弯钩是牧羊人的，意思是\"我带领子民\"；连枷是打谷的，意思是\"我供养子民\"。合起来就是：好国王既是牧人，也是粮仓。\n这座庙最有意思的是三个小祭室。抬头看天花板——上面有一个刻意开的小洞。每天某个时刻，一束光会从洞里直射下来，在地上打出一个光斑。祭司会站在光斑旁边，向神献祭。\n古人不懂光学，但他们懂戏剧。这束光不是照明，是\"神降临了\"的证据。三千年前站在这里的人，看见光落在石地上，会相信自己真的见到了神。现在很多游客会伸手去\"接住\"那束光拍照——这个动作，三千年来没变过。\n最后说这个国王是谁。拉美西斯三世是第20王朝的第二位法老，也是埃及最后一次\"打得赢\"的国王。他击退了一场几乎灭掉埃及的海上民族入侵，那场战争被刻在美迪奈特哈布神庙的墙上。打赢之后手里有大把战利品，于是开始盖庙——这座小庙就是其中之一。" },
        8: { cn: "布巴斯提斯门", en: "Bubastite Portal / Gate of Shoshenq I, Karnak", text: "这个庭院叫布巴斯提斯庭院，名字来自东南角那扇门——布巴斯提斯门，第22王朝的舍顺克一世建的。\n舍顺克一世是利比亚裔法老。他在墙上刻了一长串征战巴勒斯坦的战绩，列出一百五十多个被征服的地名。这串地名里有一个被学者反复讨论：\"亚伯拉罕的族人之地\"——这是埃及文献里极少数可能提到以色列的地方。\n更有名的是《圣经》里的对应：一位叫\"示撒\"的埃及王，在罗波安在位第五年上来攻打耶路撒冷，夺走了圣殿和王宫的宝物。学界基本认同，这位示撒就是舍顺克一世。所以你现在看的这面墙，可能是《圣经》里那场战争唯一的同时代\"敌方记录\"。\n同一面墙上还刻着阿蒙把一把剑递给国王——那是\"授权\"的标准构图：神给你武器，你替神打仗。战争在古埃及从来不是侵略，是\"恢复秩序\"。这个说法，每个帝国都用过。\n墙上的胜利浮雕有个固定套路：国王抓着敌人的头发，举起权杖准备砸下去。这个姿势叫\"击打敌人\"，从第一王朝用到罗马时期，是最古老的政治图像。为什么要抓头发？因为在图像语言里，抓着头发等于控制住对方的\"头\"，也就控制住了他的生命和意志。\n旁边一堆被绳子捆着的俘虏，脖子上套着绳圈，绳圈上一般写着地名，代表那座城被拿下了。这是战报，刻在墙上给所有路过的人看。" },
        9: { cn: "第二塔门与巨像", en: "Second Pylon of Karnak & fallen Colossus of Ramesses II", text: "先看门口那尊倒在地上的巨像——第二塔门前最有戏的一块石头。\n它原本是拉美西斯二世的立像，高约十五米。你看它两腿之间，站着一尊小小的女性立像，通说是他的女儿宾特-安塔公主。这个构图在古埃及有专门含义：\"被法老养在膝下的人\"——受他庇护，也暗示继承。堂堂法老的巨像，把女儿护在腿间，王权是这么传递的。\n再看它的脸——磨平了。名字也被改了。这尊像后来被第21王朝的平杰姆挪用，改成自己的像。所以\"这是谁的像\"其实有两个答案都对：它出生时是拉美西斯二世，去世时是平杰姆。一尊像被改过三四个主人的名字，在卡纳克是常态——名字就是存在，谁掌权谁改名。你仔细看，还能发现它至少被重刻过几次，几层主人的痕迹叠在同一块石头上。\n塔门本身由哈特谢普苏特动工，图特摩斯三世完成。跨过这道门，你就从\"外面的院子\"进入了\"神的内部\"——门外是第一庭院，普通人能进；门内是大柱厅，只有洁净的人和祭司能进。\n注意墙面的处理方式：一边是凸雕，图案从石面凸出来；一边是凹雕，往里刻进去。这不是风格偏好，是技术选择——凹雕在强烈阳光下更清楚，不怕被后人磨平，刻得也快。塞提一世爱凸雕，因为光影效果好；拉美西斯二世改用凹雕，因为更耐磨、也更难被抹掉。在卡纳克看浮雕，凸的还是凹的，基本能判断年代先后。\n最后往里看一眼。从这里开始，地面逐级抬高，光线一级级变暗，空间一级级变窄。古人是用身体感受等级的——不需要讲解牌，建筑自己会说话。" },
        10: { cn: "南外墙：卡迭石战役浮雕", en: "Battle of Kadesh Reliefs, South Outer Wall of the Great Hypostyle Hall", text: "绕到大柱厅的南墙外，这面墙上刻的是拉美西斯二世最想让人记住的一件事——卡迭石战役。\n公元前1274年前后，拉美西斯二世率军攻打赫梯人的重镇卡迭石。战况其实相当狼狈：他轻敌冒进，主力被赫梯战车冲散，几乎是孤军突围。但你看浮雕，画面完全是另一个版本——国王立于战车之上，挽弓射箭，敌军成片溃逃，坠河的坠河，求饶的求饶。这就是古埃及的\"官方通稿\"：仗可以打输，画面不能输。它不负责记录历史，它负责制造历史。\n有意思的是这面墙还暴露了一个小秘密：考古学家发现，墙上的战斗场景被人重新刻过一遍——是拉美西斯二世自己下令改的。原来的卡迭石战役刻好后，他又把画面铲掉，换上征服巴勒斯坦的新场景，只有文字说明基本没动。解释很简单：他的庙不够用了。同样的战役他在卢克索神庙、在葬祭殿各刻了一遍，墙面不够写新战功，只好把旧的糊掉。一个国王，篡改自己的墙。\n墙的东端有一大段竖排文字，是卡迭石战役的\"书面报道\"，刻了几百行——这份文字后来还传到了赫梯那边，两国各存一版。三千多年后，学者靠这两个版本，把这场古代世界的著名战役拼了出来。\n看浮雕别只看国王。找找画面边缘那些小人物：缩在堡垒上的守军、扶梯攻城的士兵、被捆成一串的俘虏。官方画面的主角永远是法老，但真实的信息，都藏在角落里。" },
        11: { cn: "北外墙：塞提一世战争图", en: "Seti I War Reliefs, North Outer Wall of the Great Hypostyle Hall", text: "北墙和南墙是一对父子展：南墙是儿子拉美西斯二世的，这面北墙，是父亲塞提一世的。\n父亲这面墙的工艺明显更好。塞提一世偏爱凸雕——图案从石面上凸出来，靠阳光的阴影显形，刻得慢、废料多，但细节极精。儿子拉美西斯二世改用凹雕，往里刻，速度快、耐风化，也因此能覆盖别人的作品。你把两面墙对比一下，就能一眼看出父子俩的\"预算和耐心\"差别。\n墙上的内容是一连串战役的连环画：从东端开始，国王率军走沙漠路，路边标注着水井的位置——这是真正的军事档案，行军路线图；接着是贝都因人的伏击、攻陷要塞、押着俘虏回来；最后是战利品献给阿蒙、穆特、孔苏三神。\n注意门洞两侧那个重复出现的场景：国王一手抓着一串俘虏的头发，一手高举白色的权杖，准备砸下去。两侧门洞各有一幅，构图完全对称。这类\"仪式性杀戮\"在埃及艺术里用了三千年，从第一王朝用到罗马时期，是最古老的政治图像。它未必对应某一场真实的处决，它是一个符号：秩序压住混沌。\n旁边墙上还有攻陷阿什凯隆城的画面：士兵用斧头砸城门，有人架云梯往上爬，附近山头上还有追杀逃兵的队伍。这是少数能看到\"攻城动作细节\"的场景——大多数浮雕只画国王高大，不画士兵干活。\n最后对比一下保存状况：这面北墙后来很多石料被后人拆去再利用，所以比南墙破损得厉害。南墙反倒因为没人打它的主意，保留得更好。" },
        12: { cn: "大柱厅", en: "Great Hypostyle Hall, Karnak – 134 Papyrus Columns", text: "好，现在停下来。抬头。\n一百三十四根石柱，十六排，占地约五千平方米，长约一百零三米，宽约五十二米。中间两排十二根，高二十一米；其余一百二十二根，高约十二米。整个空间能装下巴黎圣母院。这是人类历史上最大的宗教建筑单体空间之一，三千多年了，没被打破。\n柱子的形状是纸莎草——尼罗河边那种三棱的植物。柱身刻了一道竖棱，模仿植物的茎。中间十二根是\"开花的\"纸莎草，柱头绽放，直径五米四，顶上站一百个人都不挤；旁边的柱子是\"闭合的花苞\"。这不是装饰，是叙事：你走在一条\"正在开花\"的通道上，从含苞走到绽放，从人间走进神界。\n光也设计过。中间两排高柱撑起抬高的屋顶，两侧屋顶低，中间那一段侧墙上开着一排石格窗。太阳走到正中时，光从高窗斜射下来，正好照亮中央通道，其余地方是暗的。你可以脑补一下：三千年前，这里点满油灯，彩色的光在柱林间晃动——那不是庙，那是阿蒙从天上降临的地方。\n柱子主要是塞提一世开的工，他儿子拉美西斯二世接着完成。父子俩在这座厅里各留了一半名字。仔细看还能找到褪色的红、蓝、黄，那是当年的矿物颜料。\n再说两件事。每根柱子上都刻着拉美西斯二世的名字，从柱基一直刻到二十米高的柱头边缘——为什么刻那么高？因为人看不见，神看得见。\n还有，柱厅的屋顶早塌了。1899 年，十一根巨柱因为地下水泡软地基，像多米诺一样倒下。法国考古学家勒格兰主持修复，1902 年完工。你看到的很多柱子是被扶起来的。" },
        13: { cn: "开往卢克索的神船", en: "Sacred Barque Reliefs, North Interior Wall of the Second Pylon, Karnak", text: "回到第二塔门的内侧北墙，这里藏着大柱厅最动人的一幅画——一支正在航行的船队。\n画面上是阿蒙的大神船：船头船尾是公羊头，中间立着一座柱子撑起的小宫殿，宫殿里就是神龛，神龛上盖着帷幔。船的后面跟着孔苏的船和穆特的船——底比斯一家三口，全员出行。船头朝着南边，文字写明：目的地是\"Ipet 南方的居所\"，也就是三公里外的卢克索神庙。\n这是奥佩特节的画面——你在这座神庙里会反复遇到这个节日，因为它就是卡纳克存在的理由。每年尼罗河涨水的时候，阿蒙一家坐船南下，去卢克索\"串门\"，住上十几天再回来。\n但这面墙最妙的地方不是船，是\"船被改过\"。考古学家发现，这里原本刻着一支更老的船队：一条大船被另一条船拖着走，四个拖船的，一个是胡狼头，一个是国王本人，一个是羊头，一个是鹰头。后来墙体扩建，旧画面被铲掉，换成了现在这个版本——新的神船不要拖船了，\"无桅、无帆、无桨、无舵手\"，只有神自己在水上走。\n旧版本还有痕迹留着，仔细看能找到被盖住的旧船桨。商博良当年就注意到了这两版船队的区别，他在笔记里把两版都描了下来。\n所以你站在这里看到的，其实是两次奥佩特节：一次是人划着船送神，一次是神自己走。从\"人抬着神走\"到\"神自己走\"，这道小小的修改，就是神权慢慢膨胀的痕迹。" },
        14: { cn: "巨柱上的三代签名", en: "Column Cartouches of Ramesses II & Ramesses IV, Great Hypostyle Hall", text: "现在走近中间那十二根大柱，看柱子本身——它们不只是柱子，是一份\"分期施工日志\"。\n商博良，就是破译象形文字的那位法国学者，十九世纪仔细看过这些柱子，他的记录今天还管用。他说：每根大柱上绕着刻三个画面，其中面向中央甬道的两面，献祭的都是拉美西斯二世；但第三面——背面那面——署名却是拉美西斯四世，比他晚了大概六十年。\n为什么？因为柱子还没刻完，工程就停了。拉美西斯二世死后几十年，他的后人拉美西斯四世拿起没完工的柱子，接着刻。所以一根柱子上，两个隔了半个多世纪的国王，各占两面和一面。这是卡纳克的常态：没有一任法老把活干完，也没有一任肯把别人的名字留着。\n再看柱头顶上：柱身上部有一圈拉美西斯二世的王名圈，朝着中央甬道竖排堆叠，上面是两种形态的阿蒙交替出现。柱头模仿的是\"开放的纸莎草\"，就是顶上炸开的那一朵，柱头周长约二十一米——和柱子的高度差不多，也就是说，绕柱头走一圈，等于从地面爬到柱顶。\n还有一个冷知识：这些柱身的棱线不是随便刻的。柱子横截面被三条凸棱分成三瓣，棱线从底通到顶。南边那排大柱的最西一条棱，几乎正对着正西；北边那排对着正东。而神庙的中轴线其实偏了大约二十七度，并不正对东西。也就是说，柱子的棱线比神庙本身更\"正\"——这大概是刻柱子的人自己都没意识到的天文巧合。" },
        15: { cn: "拉美西斯二世的出生证明", en: "Divine Birth & Coronation Reliefs of Ramesses II, South Interior Wall of the Great Hypostyle Hall", text: "大柱厅南墙的内侧，有几幅画连起来，就是拉美西斯二世的\"官方出生证明\"。\n最上面一幅：陶工之神克努姆在转盘上，捏出一个婴儿——那个婴儿就是拉美西斯二世。古埃及的国王都这么\"出身\"：不是人生的，是神亲手在陶轮上造的。顺便说，在卢克索神庙的版本里，婴儿身边还站着他的\"精魂\"，这里没有——同一件事在不同庙里，细节可以不一样。\n往下一幅是加冕：他坐在宝座上，戴着统一上下埃及的双冠，两边各一位女神扶着他的肩膀——东边是上埃及的奈赫贝特，西边是下埃及的瓦吉特。荷鲁斯给他递白冠，托特给他递红冠，托特同时还要\"确认他的统治合乎正义\"。整个画面就一个意思：我不是抢来的王位，我是神从出生那天就安排好的。\n再往西，有一幅\"阿皮斯神牛赛跑\"：国王戴着红冠和白冠各跑一边，绕着神庙跑四圈——文献写明是\"分四方给土地\"，朝着四个方向各跑一次。这个仪式从第一王朝就有了，到塞德节的时候还会加上神牛陪跑。\n这一片墙最有意思的地方在于署名混乱：有的画面是塞提一世时期刻的凸雕，有的是拉美西斯二世覆盖重刻的凹雕，还有一处刻着他本人穿着豹皮、以王子身份向死去的父亲塞提一世献祭——把父亲画成和神平起平坐。儿子给父亲立像，同时把自己的出生改成神话——这就是拉美西斯二世：一个把自己从头到脚重新包装过的国王。" },
        16: { cn: "第三塔门", en: "Third Pylon of Karnak / Pylon of Amenhotep III", text: "这道门是阿蒙霍特普三世建的，第18王朝。它有个坏名声：为了填地基，他拆了更早的建筑——整块整块带浮雕的石料，被当成碎石塞进了塔门内部。法老要盖新楼，最快的办法就是拆旧楼。\n结果反而成了好事。十九世纪末，考古学家在这道塔门里挖出了上万块石料，其中很多是第12王朝的，包括白堂的部分构件。等于一座门，藏了一座博物馆。那些构件后来被一块块拼回去，现在放在露天博物馆里——一会儿你可以去看，顺便想一下：它曾经被塞在这道门里面，当碎石头用了两千年。\n在古埃及，拆别人的建筑也是\"权力展示\"。只有最强势的国王，才敢动前人的东西。\n这门还有个细节：门外两侧各有一尊巨像，其中一尊是阿蒙霍特普三世的女儿。卡纳克特别喜欢把王室女性放在门口——因为门口是公共区域，是最容易被看见的地方。\n阿蒙霍特普三世是个建筑狂人。他在底比斯西岸盖了巨大的葬祭神庙，门口两尊\"孟农巨像\"，每尊重七百多吨。他在卡纳克盖这座门，是为了把自己和祖先连起来。\n往门洞里看，能看见后面那根哈特谢普苏特方尖碑的顶端。这是全卡纳克最好的取景点之一。" },
        17: { cn: "祭神的一天", en: "Daily Ritual Reliefs, West Face of the Third Pylon, Karnak", text: "大柱厅最里头，第三塔门的西面墙上，刻着一整套\"值日表\"——庙里每天怎么伺候神，五层画面从下往上排。\n这就是埃及学里说的\"每日神事仪式\"。流程很具体：清晨，国王先点火净化——火象征荷鲁斯之眼，用来驱赶塞特势力；然后打破圣龛门上的泥封，抽出木闩，把\"天堂之门\"打开。注意看第二层画面里国王手里的东西：一只\"生命之符\"形状的水壶——刻的时候故意把它劈成两半，表示仪式只完成了一半，下午还要再来一遍，一天三次。\n再看一个细节：国王倒退着退出圣龛，手里攥着一把稻草，一边退一边扫掉自己脚印。为什么？因为\"我走了，但我不能留下我来过的痕迹\"。对神要保持绝对的干净。还有，国王伸向神像的那只手，只竖起一根小指——因为真去给神像涂油的人，手指上戴着金或银的指套，隔着手套碰神。浮雕画的就是这个动作。\n这套仪式的实际执行者当然不是国王本人，是当值的祭司——但浮雕上永远画国王。因为理论上整个埃及只有法老能侍奉神，祭司只是他的\"代理\"。你在这里看到的所有\"法老亲自上香\"，实际都是祭司的日常工作，被写成了国王的人设。\n墙上还有\"新年点火炬\"的画面：塞提一世举着火炬，文字写的是\"用火点亮一年的第一天\"。古埃及人把新年、点火、神像换装连成一整套，你今天在卢克索看的这些墙，就是当年的操作手册。" },
        18: { cn: "两根方尖碑", en: "Obelisk of Thutmose I & Obelisk of Hatshepsut, Karnak", text: "眼前这两根碑，一次讲完——因为它们是同一件事的两种写法。\n先说方尖碑是什么。一根整石打成的四棱柱，顶上一个小金字塔。古埃及人认为那是\"被石化的阳光\"：太阳的第一束光落在原始土丘上，那一瞬间凝固下来，就是方尖碑。所以方尖碑永远和太阳神绑定，永远成对立在神庙门口。碑顶那个尖有个专门名称，叫\"金字塔顶\"，通常包金或包铜，太阳一照，几十公里外都看得见。所以方尖碑不只是纪念碑，它是灯塔——告诉所有人，神在这里。\n矮的那根，是图特摩斯一世的，高约二十一米，重一百四十三吨。图特摩斯一世是第18王朝的开创者之一，也是第一个把法老葬进国王谷的人——他的石棺你在大埃及博物馆见过。他在这儿立碑，是在宣告一件事：这个王朝是新的，但它站在最古老的神的地盘上。这根本来是一对，另一根早就倒了。\n高的那根，是全埃及现存最高的方尖碑，二十九点五米，一整块红色花岗岩，重约三百二十吨。它的主人是哈特谢普苏特——古埃及最出名的女法老。\n一个女人，在一个只承认男性继位的制度里称王，她用了最直接的办法：把自己刻成男人。你看碑上的浮雕——她戴着法老的头巾，挂着假胡须，胸前是男性的姿态。她不是\"假装女人当国王\"，她是\"把女人改写成国王\"。立这根碑，就是她最硬核的广告。她自己在碑文里写，她给了神\"像小麦一样多的黄金\"——这不是炫富，是宣告：我有能力献上最贵的东西。\n这碑也原本一对，另一根倒了，断成几截，有一段就躺在圣湖边上。还有个细节：碑身有一面没刻完。因为哈特谢普苏特死后，图特摩斯三世下令磨掉她的名字，但碑太高够不着，只能磨下面能磨的——所以上半截还留着她的名字，下半截是一片空白。\n最后说石头怎么来的。阿斯旺采石场，整块挖出，没有裂缝、没有拼接。工人沿石缝凿一排洞，塞进干木楔，灌水——木头膨胀，石头就裂开。三百二十吨、两百公里，靠尼罗河的船和岸上的滚木。一处失误，石头就废了。" },
        19: { cn: "圣所", en: "Granite Sanctuary of Philip Arrhidaeus, Karnak", text: "这里就是卡纳克的心脏。古埃及语叫\"至圣之所\"。\n最里面原本放着一个石制神龛，龛里是阿蒙的神像。神像不大，通常用金或镀金木做，锁在龛里，每天清晨由大祭司\"开封\"——开锁、点香、换衣、供食。这套流程一天三次，全年无休。神像不吃东西，供品最后由祭司分掉。所以\"神吃饭\"这件事，养活的是一整个祭司阶层。\n讲一下这套每日仪式，它不是象征性的，是一份非常具体的操作流程，记录在纸莎草文献里：清晨开锁，揭开神龛的封泥；点香、洒水，净化空间；取出神像，换下旧衣，涂油，换上新衣；摆上食物和饮料；退出，封门。\n整个过程只有大祭司一个人能看神像。其他人只能在外面听声音——摇动叉铃、唱赞美诗。所以\"见神\"这件事，在古埃及是极度稀缺的资源。这也解释了神庙为什么是狭长递进的平面：越往里，能进的人越少，最后只剩一个人。\n现在的圣所是花岗岩的，由亚历山大大帝的弟弟腓力·阿里达乌斯时代重建，原来那座的底座还在下面。也就是说，这个位置被反复重建了至少两千年，每一次都建在同一个点上。为什么不能挪？因为这里被认为是\"创世的第一块土丘\"——神庙不是盖在随便什么地方的，是盖在宇宙开始的那一点上。所以你可以说，卡纳克所有建筑，都是围着这个小房间长出来的。\n进去的时候注意脚下：门槛被几千年的人踩出了凹槽。圣所前面的地面原本还铺着银板——银在古埃及比金贵，因为要进口。踏在银上走过去，是只有法老和大祭司才有的待遇。" },
        20: { cn: "中王国庭院", en: "Middle Kingdom Court, Karnak – oldest blocks", text: "这一片看起来最\"不像样子\"的废墟，是卡纳克最老的部分。\n卡纳克的起点非常小。公元前两千年前后，第11王朝的因特夫二世在这里盖了一座泥砖小庙，可能只有几间房、一圈柱廊。后来所有宏伟的东西，都是围着这个小泥砖庙一层层加上去的。\n这里有个考古学上的证据链，非常漂亮：第一，在卡纳克找到一根被重复使用的砂岩柱，上面刻着因特夫二世的名字和奉献词；第二，这根柱子的尺寸和样式，符合第11王朝的工艺；第三，它被发现的位置，正好在中王国地层附近。三条合起来，学者推断：卡纳克最早的建筑，是第11王朝的一座小型泥砖神庙，带石柱门廊。\n再往下一层想：为什么底比斯能崛起？因为第11王朝的国王来自底比斯，统一埃及之后，把家乡的神——阿蒙——抬成了国家神。神升格，庙就升格；庙升格，城就升格。于是底比斯从一个中等城市变成了帝国首都。是神庙建城市，不是城市建神庙。\n所以你现在站的位置，是\"帝国起点\"。脚下这几块不起眼的砖，是一切的开始。" },
        21: { cn: "图特摩斯三世庆典厅", en: "Festival Hall of Thutmose III / Akh-Menu, Karnak", text: "圣所后面这座建筑，是图特摩斯三世给自己盖的\"私人会所\"，叫阿赫-梅努，意思是\"最辉煌者\"。图特摩斯三世是古埃及打下疆土最多的法老，也有人叫他\"埃及的拿破仑\"。\n它最大的功能，是办塞德节——法老登基三十周年举行的\"复壮仪式\"。在这个仪式上，国王要跑一段路、射箭、举旗，向全国证明：我还能干。跑不动了，就说明该换人了。所以塞德节本质上是\"国王的体检\"，而且是公开的。\n流程文献里有记载：国王先在一座专门的厅里坐下，接受上下埃及两顶王冠；然后绕场奔跑，象征\"我还能统治\"；接着射四支箭，分别射向四个方向，象征\"我控制四方\"；最后坐上两个宝座，分别代表上下埃及。核心逻辑是：王权要定期续费。三十年一次，之后每三年一次。\n这厅最有名的，是一根根帐篷式的柱子——它们被刻成木杆的样子，顶部刷红、黄、蓝的条纹，模仿节庆时搭的帐篷。等于用石头做了一场\"临时的庆典\"，然后永久保存下来。\n往里有\"祖先厅\"，墙上刻着六十多位历代国王的名单，每个名字都圈在王名圈里，图特摩斯三世自己在最后。他在说：我站在这条线上，我是这条线的终点。\n再往东北是\"植物园\"——墙上刻满他从叙利亚带回来的奇花异兽。那是战利品清单，也是\"我把世界带回来了\"的宣言，被不少人称作人类历史上最早的\"自然博物馆\"，只不过它是三千五百年前的。" },
        22: { cn: "拉美西斯二世庙与赫梯条约", en: "Temple of Ramesses II & Egyptian-Hittite Peace Treaty inscription, Karnak", text: "东侧这一小片，是拉美西斯二世在卡纳克的\"自留地\"。他在位六十七年，生了上百个孩子，打了一辈子的仗，盖了一辈子的庙。\n他在卡纳克的做法很典型：不是推倒重建，是\"往上加名\"。你去看他碰过的每一面墙——原稿是别人的，名字改成他的，脸也改成他的。学界有个专门的词形容这个，叫 usurpation，篡改。\n背后有个非常现实的逻辑：在古埃及，名字就是存在。名字被刻在墙上，你就在；名字被磨掉，你就消失。所以每个法老都拼命在石头上刻名字，也拼命磨掉别人的名字。卡纳克是一面被反复擦写的墙。\n这一带墙上还藏着一个常被错过的世界之最。公元前1259年，拉美西斯二世和赫梯国王哈图西利三世签了一份和平条约。你可能会说，签条约有什么稀奇？可这是人类历史上现存最早的一份和平条约。它的另一半用楔形文字刻在泥板上，埋在土耳其的哈图沙遗址里；两边一对，内容完全一致——两国约定永不开战、互相支援。打了十几年，两位老大终于坐下来握了个手。\n值得多说一句：这份\"条约\"在埃及这一侧，刻在神庙墙上，是给神看的，也是给所有路过的人看的。它不只是外交文件，是一次公开的政治宣传。" },
        23: { cn: "藏宝庭院", en: "Cachette Courtyard, Karnak – 1903 statue cache", text: "这个院子看起来平平无奇，但它是考古史上最惊人的发现之一。\n1903年，法国考古学家乔治·勒格兰在这里发现了一个巨大的坑。坑里埋着约八百尊石像加上万件青铜像，合计近两万件。祭司们在某个动荡年代，把庙里所有的雕像集中起来，挖个坑埋掉，然后封上。他们不是在毁坏，是在保护。\n为什么？因为雕像留在原处会被抢、被砸、被熔。埋起来，等太平了再挖出来。只是他们再也没回来。学界的主流解释是托勒密时期神庙面临动荡，祭司集中保护；也有说法认为，是庙里雕像太多、放不下，于是\"归档\"。\n不管原因是什么，结果惊人：这一坑东西，撑起了全世界几十家博物馆的古埃及收藏。开罗埃及博物馆的很多名品，都出自这里。它也改变了整个埃及学对\"神庙雕像\"的理解——原来神庙里不只有国王像，还有大量神像、私人像、动物像。\n顺带说，勒格兰在卡纳克干了二十多年，主持发掘和修复；1899年柱厅十一根巨柱倒塌，也是他组织扶正的。\n你现在站的这个院子，就是这个坑的位置。石头还在地下，故事已经传了一百年。" },
        24: { cn: "南轴与第七塔门", en: "Southern Processional Axis & Seventh Pylon, Karnak", text: "从这里开始，你离开了东西主轴，转向南轴。\n卡纳克有两条轴，这在古埃及神庙里是罕见的。东西轴对着太阳，是\"神的路\"；南北轴对着卢克索神庙，是\"人的路\"——奥佩特节游行就走这条。\n第七塔门是图特摩斯三世建的，用来标记南轴的起点。它比主轴上的塔门小得多，因为南轴是\"礼仪性\"的，不是\"神圣性\"的。等级差别，从尺寸就能看出来。\n从这里往南看，能看到后面一串塔门依次排开。那种\"一道门接一道门\"的纵深，是卡纳克最震撼的视觉体验之一。\n南轴的作用，一句话说：把神送到另一个神那里去。\n奥佩特节的核心，是阿蒙\"访问\"卢克索神庙里的阿蒙-卡穆特夫——那是阿蒙的另一个形态。所以整条南轴不是\"延伸\"，是\"连接\"。你可以把整条南轴想象成一条流水线，每个塔门是一个工位，负责一个环节：塔门旁边通常连着一个小庭院，柱廊在这里起\"缓冲\"作用，游行队伍整队、换装、重新排列。\n门两侧的墙上有游行场景：祭司抬着神舫，前面有人洒水、点香，后面跟着歌手和舞者。队伍很长，行进很慢。\n顺便看一眼这几道塔门的做法：它们不是实心石头砌的，是两片石墙中间填碎石和土，叫\"夹心\"。所以你看到的每一道塔门，其实都是一个包了石皮的土堆。卡纳克大部分塔门都有不同程度的倾斜和开裂，不是因为年代久，而是因为它的建造方式本来就不追求永久。真正追求永久的是方尖碑和圣所——那些是整块花岗岩。近年那些水泥勾缝、钢架支撑、新补的石块，都是1979年底比斯列入世界遗产之后才有的系统保护。" },
        25: { cn: "孔苏神庙", en: "Temple of Khonsu, Karnak", text: "西南角这座庙，是卡纳克保存最完整的建筑——孔苏神庙。\n孔苏是月神，阿蒙和穆特的儿子，底比斯神一家三口里那个\"孩子\"，也是\"治愈之神\"。他的形象是木乃伊状的少年，头侧有一缕少年的发辫，头顶是月轮和月牙。\n这座庙从拉美西斯三世开始建，一直修到托勒密时期，前后几百年。正因为修得晚、用得久，它的屋顶还在，柱子还全，墙上的颜色还在。\n这是卡纳克唯一能让你\"感受到室内\"的地方。走进去，光线是从高处的石格窗漏下来的，墙面上的浮雕还带着淡淡的彩。很多年以前，全部卡纳克的墙都是这样彩色的——阳光和风把颜色吹掉了，只有这里留了下来。关于它为什么保存得好，还有一个说法：它后来被基督徒、穆斯林长期使用过，屋顶和墙体都没怎么被拆，而修复师这些年一直在小心翼翼地刮掉墙上几百年的烟灰，结果底下露出了惊艳的彩绘。\n门口那道门是托勒密三世建的，叫巴布·阿马拉，保存状态好到让人误以为是新建的。它的比例和线条，是卡纳克晚期建筑的精品。\n墙上一批浮雕是\"神谕\"场景：神像被抬出来，靠前进或后退来回答是或否。这是古埃及的\"问神\"，普通人也能参与。\n从孔苏神庙往南，就是那条通往卢克索神庙的斯芬克斯大道。" },
        26: { cn: "圣湖与圣甲虫", en: "Sacred Lake & Giant Scarab Statue, Karnak", text: "这片长方形的水面，是卡纳克最安静的地方。长约一百二十米，宽七十七米，深约三米，今天的水来自地下，不是尼罗河。\n在古埃及，圣湖不是风景，是\"净水\"。每天清晨，祭司要在这儿净身，才能进庙伺候神。它象征着创世之前那一片茫茫的原始之水——整个世界，就是从这样一汪水里长出来的。从水里出来，就是\"重新出生\"。\n它还有几个功能：神舫停靠巡游、节日演出，还养水鸟——鹅是阿蒙的化身之一。湖底下有一条地下通道通向神庙内部，祭司可以不出水面就进入圣所。湖的北侧原本有座建筑，里面有一口深井，用来测量尼罗河的水位。水位决定收成，收成决定税收，税收决定神庙的财富。\n湖边的黑色花岗岩圣甲虫，是阿蒙霍特普三世做的，后来被第25王朝的塔哈尔卡搬到这里。它是已知最大的圣甲虫雕塑之一。\n蜣螂就是屎壳郎。古埃及人看它推粪球，联想到太阳每天滚动升起，把它当成\"复活与重生\"的象征——它推着粪球，就像太阳推着自己越过天空。\n当地人说，绕它逆时针走七圈，愿望就会实现。这个说法不一定古老，但流传很广；逆时针方向象征太阳的运行。来都来了，要不要走一圈？" },
        27: { cn: "祭司区", en: "Priests Quarter / Storage Magazines, Karnak South", text: "最后走到的这片土坡，是祭司们住的地方。\n考古学家在这里挖出了成排的泥砖房子、烤炉、磨石、陶罐，还有大量印着祭司头衔的印章。房子不大，墙是泥砖的，地板是夯土的，两三层，底层是厨房和储藏，上层住人，屋顶有楼梯通上去——底比斯夏天太热了，晚上睡在屋顶。\n但有一样东西很特别：这里的垃圾里几乎找不到猪骨和鱼骨。为什么？因为猪和鱼在神庙里被视为不洁，祭司不能吃，而庙外的人吃。一条饮食禁忌，在垃圾堆里划出了两个阶层。\n而庙外的居民区，这两样很常见。一条宗教规定，在垃圾堆里留下了清晰的界线——这是考古学最迷人的地方：信仰会消失，垃圾不会。\n祭司的等级很严：最高是大祭司，下面依次是第二、第三、第四祭司，再往下是\"神父\"、\"纯洁者\"、诵经祭司、仪仗人员。他们轮班：一年四班，每班三个月，值班期间住在庙内，不能回家。\n他们的口粮来自神庙的供品——神\"吃\"过的东西，分给祭司。所以祭司阶层的日常，是靠神的剩饭养活的。这个细节听起来不敬，但它恰恰说明神庙是一台巨大的经济机器：供品进来，人员出去，财富在循环。\n再往南走，就是斯芬克斯大道，通往三公里外的卢克索神庙。" },
        28: { cn: "斯芬克斯大道 → 卢克索神庙 · 收尾", en: "Avenue of Sphinxes, Karnak to Luxor Temple", text: "走出卡纳克，脚下这条路通向卢克索神庙，全长约三公里，两侧原本站着一千三百多尊斯芬克斯。\n这条路不是装饰，是仪式通道。每年奥佩特节，阿蒙的神舫从卡纳克出发，沿这条路抬到卢克索，在那里停留十几天，再抬回来。全程由祭司抬着，普通人只能在两边看。整个节日最长持续二十七天——比现在的任何一场狂欢节都长。\n这个节日的时间是慢慢长起来的：最初十一天，到第18王朝成了主要节日，拉美西斯二世时期延长到二十七天。整座底比斯在这近一个月里基本处于\"节日状态\"。他们相信节日期间神的力量最强，人间最接近神界，所以把最好的都拿出来：金船、香料、音乐、酒。\n这条路在2021年被重新开通，埃及政府办了一场很大的仪式，叫\"金色的队伍\"。之前花了几十年清理、发掘、修复，把埋在民居下面的路段一段段挖出来。你想一下这个工程量：三公里长，两侧各一排，一千三百多尊像，每一尊都要编号、加固、归位。\n走在上面，你会明白一件事：古埃及人不是在庙里信神，他们是在路上信神。神要出门，人要围观，城市要清空，整个底比斯为一场游行停摆近一个月。\n所以卡纳克的意义，不在于某一根柱子有多高。它在于：一个文明用两千年、三十位法老、几万名工匠，持续不断地往同一个地方加石头，只为了证明一件事——秩序是真的。\n现在你可以往南走了。前面是卢克索神庙，故事还没完。" }
        };

        /* ===== 倍速 ===== */
        const SPEEDS = [1.0, 1.25, 1.5, 0.8];
        let speedIdx = 0;

        let currentSpotId = null;
        let eventSource = null;
        let fullAnswer = "";
        const player = document.getElementById("global-player");
        const playBtn = document.getElementById("play-trigger");
        const modalPlay = document.getElementById("modal-play");
        const modal = document.getElementById("spot-modal");

        /* ===== 选中点位：底部播放条更新 + 弹出详情层 ===== */
        function selectSpot(id) {
            currentSpotId = id;
            const s = SPOTS[id];
            if (!s) return;
            document.querySelectorAll(".spot-marker").forEach(el => {
                el.classList.toggle("active", Number(el.dataset.spot) === id);
            });
            // 底部播放条
            document.getElementById("spot-title").innerText = `🔊 ${id}. ${s.cn}`;
            document.getElementById("spot-sub").innerText = s.en;
            playBtn.removeAttribute("disabled");
            // 弹出详情层
            openModal(id, s);
        }

        function transcriptHTML(s) {
            const paras = s.text.split("\n").filter(x => x.trim());
            return `<div class="t-title">${s.cn} <span class="t-en">${s.en}</span></div>`
                 + paras.map(p => `<p>${p}</p>`).join("");
        }

        /* ===== 详情弹层：图片(或预留位) / 播放条 / 文字 ===== */
        function openModal(id, s) {
            document.getElementById("modal-title").innerText = `${id}. ${s.cn}`;
            document.getElementById("modal-sub").innerText = s.en;
            document.getElementById("modal-transcript").innerHTML = transcriptHTML(s);

            // 图片或预留占位
            const frame = document.getElementById("photo-frame");
            const photo = spotPhotos[id];
            if (photo) {
                frame.innerHTML = `<img src="${photo}" alt="${s.cn}" id="modal-img">`;
                const img = document.getElementById("modal-img");
                img.addEventListener("error", function() {
                    frame.innerHTML = placeholderHTML("图片加载失败，请检查路径：" + photo);
                });
            } else {
                frame.innerHTML = placeholderHTML("实景图待补充 · 此点位预留图片位置");
            }

            // 加载音频
            loadAudio(`audio/${id}.mp3`);
            modal.classList.add("show");
        }

        function placeholderHTML(msg) {
            return `<div class="photo-placeholder">
                <div class="ph-icon">🖼️</div>
                <div>${msg}</div>
            </div>`;
        }

        function closeModal(event, force) {
            if (!force && event && event.target !== modal) return;
            modal.classList.remove("show");
            player.pause();
        }

        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && modal.classList.contains("show")) closeModal(null, true);
        });

        /* ===== 音频播放（预生成 mp3 + 倍速） ===== */
        function loadAudio(src) {
            player.pause();
            player.src = src;
            player.playbackRate = SPEEDS[speedIdx];
            player.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
        }

        function setPlayState(playing) {
            const label = playing ? "暂停" : "播放";
            playBtn.innerText = label;
            modalPlay.innerText = label;
        }

        function toggleAudio() {
            if (currentSpotId === null) return;
            if (player.paused) { player.play(); setPlayState(true); }
            else { player.pause(); setPlayState(false); }
        }

        function cycleSpeed() {
            speedIdx = (speedIdx + 1) % SPEEDS.length;
            player.playbackRate = SPEEDS[speedIdx];
            document.getElementById("speed-btn").innerText = SPEEDS[speedIdx].toFixed(2).replace(/0$/,"") + "x";
        }

        function fmt(t) {
            if (!isFinite(t)) return "--:--";
            const m = Math.floor(t/60), s = Math.floor(t%60);
            return m + ":" + String(s).padStart(2, "0");
        }

        player.addEventListener("timeupdate", () => {
            const pct = (player.currentTime / player.duration * 100) || 0;
            document.getElementById("modal-played").style.width = pct + "%";
            document.getElementById("modal-time").innerText = fmt(player.currentTime) + " / " + fmt(player.duration);
        });

        function seekAudio(e) {
            const track = document.getElementById("modal-track");
            const rect = track.getBoundingClientRect();
            const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            if (isFinite(player.duration)) player.currentTime = ratio * player.duration;
        }

        /* ===== 地图整体缩放拖动（双指捏合 / 双击放大 / 滚轮，可拖动平移） ===== */
        (function () {
            const mc = document.getElementById("map-container");
            const wrap = mc.querySelector(".map-wrapper");
            const MIN = 1, MAX = 4;

            wrap.style.transformOrigin = "0 0";
            wrap.style.willChange = "transform";

            let scale = 1, tx = 0, ty = 0;      // transform 状态
            let moved = false;                   // 本次手势是否为拖动（抑制误触点击）
            let mode = "none";                   // none / pan / pinch
            let startX = 0, startY = 0, baseTx = 0, baseTy = 0;
            let pinchDist0 = 0, pinchScale0 = 1, pinchMid = null;
            let lastTapT = 0, lastTapX = 0, lastTapY = 0;

            function baseX() { return wrap.offsetLeft; }
            function baseY() { return wrap.offsetTop; }

            function apply() {
                const r = mc.getBoundingClientRect();
                const w = wrap.offsetWidth * scale, h = wrap.offsetHeight * scale;
                // 拖动边界：内容始终覆盖容器；缩到 1x 时回正
                if (w <= r.width) tx = (r.width - w) / 2 - baseX();
                else tx = Math.min(-baseX(), Math.max(r.width - w - baseX(), tx));
                if (h <= r.height) ty = (r.height - h) / 2 - baseY();
                else ty = Math.min(-baseY(), Math.max(r.height - h - baseY(), ty));
                wrap.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
            }

            function zoomAt(px, py, factor) {
                const ns = Math.min(MAX, Math.max(MIN, scale * factor));
                const k = ns / scale;
                // 以容器坐标 (px,py) 为锚点缩放（wrap 布局原点在 baseX/baseY）
                tx = (px - baseX()) - ((px - baseX()) - tx) * k;
                ty = (py - baseY()) - ((py - baseY()) - ty) * k;
                scale = ns;
                apply();
            }

            window.resetZoom = function () {
                scale = 1; tx = 0; ty = 0;
                wrap.style.transition = "transform .25s ease";
                apply();
                setTimeout(() => wrap.style.transition = "", 260);
            };

            /* ---- 触摸手势 ---- */
            mc.addEventListener("touchstart", e => {
                if (modal.classList.contains("show")) return;
                if (e.touches.length === 1) {
                    mode = "pan";
                    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                    baseTx = tx; baseTy = ty; moved = false;
                } else if (e.touches.length === 2) {
                    mode = "pinch";
                    const [a, b] = e.touches;
                    pinchDist0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
                    pinchScale0 = scale;
                    pinchMid = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
                    moved = true; // 双指期间不算点击
                }
            }, { passive: true });

            mc.addEventListener("touchmove", e => {
                if (modal.classList.contains("show")) return;
                if (mode === "pan" && e.touches.length === 1 && scale > 1) {
                    const dx = e.touches[0].clientX - startX;
                    const dy = e.touches[0].clientY - startY;
                    if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
                    tx = baseTx + dx; ty = baseTy + dy;
                    apply();
                } else if (mode === "pinch" && e.touches.length === 2) {
                    const [a, b] = e.touches;
                    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
                    const r = mc.getBoundingClientRect();
                    // 从手势起点状态整体重算，保证锚点稳定
                    const ns = Math.min(MAX, Math.max(MIN, pinchScale0 * d / pinchDist0));
                    const k = ns / pinchScale0;
                    const px = pinchMid.x - r.left, py = pinchMid.y - r.top;
                    scale = pinchScale0;
                    tx = baseTx; ty = baseTy;
                    tx = (px - baseX()) - ((px - baseX()) - tx) * k;
                    ty = (py - baseY()) - ((py - baseY()) - ty) * k;
                    scale = ns;
                    apply();
                }
                if (mode !== "none") e.preventDefault();
            }, { passive: false });

            mc.addEventListener("touchend", e => {
                if (mode === "pinch" && e.touches.length < 2) {
                    mode = "none";
                    if (e.touches.length === 1) { // 余下一指转为拖动
                        mode = "pan";
                        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                        baseTx = tx; baseTy = ty;
                    }
                    return;
                }
                if (mode === "pan" && e.touches.length === 0) {
                    mode = "none";
                    // 双击（双触）放大：300ms 内两次点按同一位置
                    if (!moved) {
                        const t = Date.now();
                        const r = mc.getBoundingClientRect();
                        const px = (e.changedTouches[0] || { clientX: 0 }).clientX - r.left;
                        const py = (e.changedTouches[0] || { clientY: 0 }).clientY - r.top;
                        if (t - lastTapT < 300 && Math.abs(px - lastTapX) < 40 && Math.abs(py - lastTapY) < 40) {
                            if (scale > 1) resetZoom(); else zoomAt(px, py, 2.5);
                            lastTapT = 0;
                        } else {
                            lastTapT = t; lastTapX = px; lastTapY = py;
                        }
                    }
                }
            });

            /* ---- 拖动后抑制误触点位点击 ---- */
            mc.addEventListener("click", e => {
                if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
            }, true);

            /* ---- 桌面端：滚轮缩放 ---- */
            mc.addEventListener("wheel", e => {
                e.preventDefault();
                const r = mc.getBoundingClientRect();
                zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
            }, { passive: false });

            /* ---- 桌面端：鼠标拖动 ---- */
            mc.addEventListener("mousedown", e => {
                if (scale === 1) return;
                mode = "pan"; moved = false;
                startX = e.clientX; startY = e.clientY; baseTx = tx; baseTy = ty;
                const onMove = ev => {
                    const dx = ev.clientX - startX, dy = ev.clientY - startY;
                    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
                    tx = baseTx + dx; ty = baseTy + dy; apply();
                };
                const onUp = () => {
                    mode = "none";
                    window.removeEventListener("mousemove", onMove);
                    window.removeEventListener("mouseup", onUp);
                };
                window.addEventListener("mousemove", onMove);
                window.addEventListener("mouseup", onUp);
            });

            mc.addEventListener("dblclick", e => {
                const r = mc.getBoundingClientRect();
                if (scale > 1) resetZoom();
                else zoomAt(e.clientX - r.left, e.clientY - r.top, 2.5);
            });

            window.addEventListener("resize", apply);
        })();

        /* ===== 法老密示：AI 问答（SSE） ===== */
        function handleKeyPress(e) { if (e.key === "Enter") askPharaoh(); }

        function askPharaoh() {
            const input = document.getElementById("user-question");
            const bubble = document.getElementById("ai-bubble");
            const btn = input.nextElementSibling;
            const question = input.value.trim();
            if (!question) return;

            if (eventSource) { eventSource.close(); eventSource = null; }
            fullAnswer = "";
            input.value = ""; input.disabled = true; btn.disabled = true;
            bubble.innerHTML = "⏳ <i>法老正拨开三千年的风沙，在泥板上翻阅史料...</i>";

            const contextQuestion = currentSpotId !== null
                ? `当前游客在卡纳克神庙：${SPOTS[currentSpotId].cn}（${SPOTS[currentSpotId].en}）。问题是：${question}`
                : question;

            const url = `/api/chat?question=${encodeURIComponent(contextQuestion)}`;
            eventSource = new EventSource(url);

            eventSource.addEventListener("conversation.message.delta", function (e) {
                try {
                    const obj = JSON.parse(e.data);
                    if (obj.type === "answer") {
                        const textChunk = obj.content || obj.reasoning_content || "";
                        if (textChunk) {
                            fullAnswer += textChunk;
                            bubble.innerHTML = `🔮 <b>法老密示：</b><br>${fullAnswer}`;
                        }
                    }
                } catch (err) { console.log("delta解析跳过", err); }
            });
            eventSource.addEventListener("conversation.chat.completed", safeClose);
            eventSource.addEventListener("conversation.chat.failed", function () {
                bubble.innerHTML = "🔮 <b>法老密示：</b><br>神殿算力已耗尽，请稍后再向我发问。";
                safeClose();
            });
            eventSource.onerror = function () {
                bubble.innerHTML = "🔮 <b>法老密示：</b><br>法老正在神殿沉睡，恢复网络后再来打扰吧。";
                safeClose();
            };
            function safeClose() {
                if (eventSource) { eventSource.close(); eventSource = null; }
                input.disabled = false; btn.disabled = false;
            }
        }

        /* ===== PWA 离线服务 ===== */
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js")
                    .then(() => console.log("离线导览系统准备就绪！"))
                    .catch(err => console.log("离线注册失败:", err));
            });
        }
    </script>
</body>
</html>
